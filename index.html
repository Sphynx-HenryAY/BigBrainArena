<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <title>靈活腦學校 · Big Brain Arena</title>
  <meta name="description" content="靈活腦學校是一個可擴充的腦力訓練小遊戲平台，收錄心算、記憶、反應、專注等訓練。純靜態網頁，可直接部署到 GitHub Pages。" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("bigbrain:v1") || "{}");
        var theme = saved && saved.settings && saved.settings.theme;
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="靈活腦學校首頁">
        <span class="brand-mark" aria-hidden="true">🧠</span>
        <span class="brand-text">
          <strong>靈活腦學校</strong>
          <small>Big Brain Arena</small>
        </span>
      </a>
      <nav class="nav" aria-label="主要導覽">
        <a class="nav-link" data-nav="home" href="#/">訓練大廳</a>
        <a class="nav-link" data-nav="stats" href="#/stats">我的成績</a>
        <a class="nav-link" data-nav="about" href="#/about">擴充指南</a>
      </nav>
      <div class="topbar-actions">
        <button id="sound-toggle" class="icon-btn" type="button" aria-label="切換音效" title="切換音效">🔊</button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切換主題" title="切換主題">🌙</button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="footer">
      <span>🧠 靈活腦學校 · 每天一點腦力訓練</span>
      <span class="footer-links">
        <a href="#/stats">我的成績</a>
        <a href="#/about">如何新增遊戲</a>
      </span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
